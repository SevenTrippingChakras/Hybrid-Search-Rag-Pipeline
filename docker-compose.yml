# Local OpenSearch for dev: single node, security off (plain http on 9200).
# Prod parity is Amazon OpenSearch Service; the engine and queries are identical.
services:
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: hybrid-rag-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
