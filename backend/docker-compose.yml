# Local dev stack. MongoDB is hosted (Atlas, via MONGO_URI in .env), so it is not
# a service here. OpenSearch runs locally; prod parity is Amazon OpenSearch Service.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-rag-backend
    env_file: .env
    environment:
      # Inside the compose network, reach OpenSearch by its service name, which
      # overrides the localhost value in .env used when running on the host.
      - OPENSEARCH_HOST=http://opensearch:9200
    ports:
      - "8000:8000"
    volumes:
      # Persist the HuggingFace cache so the reranker model downloads once and
      # survives container restarts, instead of re-downloading every boot.
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - opensearch

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: hybrid-rag-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  opensearch-data:
  hf-cache:
